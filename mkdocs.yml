site_name: EdgeTX Lua Reference Guide
site_description: Next-generation Lua API docs generated from EdgeTX source annotations
site_url: https://luadoc.edgetx.org/
repo_url: https://github.com/EdgeTX/lua-reference-guide
repo_name: EdgeTX/lua-reference-guide
edit_uri: edit/edgetx_2.12/website/md-docs/
docs_dir: website/md-docs
site_dir: site
exclude_docs: |
  migration/
  api-reference/review.md
  api-reference/review-*.md
  api-reference/module-*.md
  javascripts/review-workbench.js
theme:
  name: material
  logo: assets/edgetx-logo.svg
  favicon: assets/edgetx-logo.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.path
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      # Default separator only splits on whitespace/hyphens ([\s\-]+), so a
      # dotted API symbol like "model.getMix" indexes as one token and a
      # search for just "getMix" can't prefix-match it (the token starts
      # with "model", not "getmix"). Also split on "." so the module and
      # member name become separate searchable tokens.
      separator: '[\s\-\.]+'
  - minify:
      minify_html: true
extra_css:
  - stylesheets/extra-live-v2.css
extra_javascript:
  - javascripts/mobile-nav-inline.js
  - javascripts/legacy-version-banner.js
extra:
  version:
    provider: mike
    default: latest
    alias: true
  legacy_version:
    enabled: false
    label: Legacy version
    message: This documentation version is preserved for reference and may not include later corrections or the newest docs structure.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EdgeTX/lua-reference-guide
    - icon: fontawesome/brands/discord
      link: https://discord.gg/wF9wUKnZ6H
