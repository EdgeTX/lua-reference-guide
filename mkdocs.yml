site_name: EdgeTX Lua Reference Guide
site_description: EdgeTX 2.11 Lua documentation
site_url: https://luadoc.edgetx.org/
repo_url: https://github.com/EdgeTX/lua-reference-guide
repo_name: EdgeTX/lua-reference-guide
# The publish workflow sets DOCS_EDIT_URI to the branch being built.
edit_uri: !ENV [DOCS_EDIT_URI, "edit/edgetx_2.11/website/md-docs/"]
docs_dir: website/md-docs
site_dir: site
theme:
  name: material
  logo: assets/edgetx-logo.svg
  favicon: assets/edgetx-logo.svg
  font: false
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  features:
  - navigation.indexes
  - navigation.path
  - navigation.top
  - toc.follow
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
plugins:
- search:
    separator: '[\s\-\.]+'
- minify:
    minify_html: true
extra_css:
- stylesheets/extra-live-v2.css
extra_javascript:
- javascripts/mobile-nav-inline.js
- javascripts/legacy-version-banner.js
extra:
  version:
    provider: mike
    default: latest
    alias: true
markdown_extensions:
- tables
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.tilde
- attr_list
- md_in_html
- toc:
    permalink: true
