# Publishes the actively-maintained docs (main -> "dev", edgetx_2.12 ->
# "latest") via `mike deploy` on every push. Legacy GitBook-era versions
# (2.4-2.11) are NOT handled here -- this job assumes a working mkdocs.yml
# already exists at the branch root when triggered, but none of those
# branches ever had one committed (they're raw GitBook content; building
# them requires running tools/import_legacy_gitbook.py first, which this
# workflow doesn't do). They're deployed manually instead: run the import
# script against each legacy branch/ref, then `mike deploy --config-file
# <generated config> --push <version>`. See MIGRATION-PLAN.md.
name: Publish Versioned Docs

on:
  push:
    branches:
      - main
      - edgetx_2.12
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          branch="${GITHUB_REF_NAME}"
          latest_branch="edgetx_2.12"

          case "${branch}" in
            edgetx_2.12)
              version_id="2.12"
              title="2.12"
              ;;
            edgetx_2.4)
              version_id="2.4"
              title="2.4"
              ;;
            edgetx_2.5)
              version_id="2.5"
              title="2.5"
              ;;
            edgetx_2.6)
              version_id="2.6"
              title="2.6"
              ;;
            edgetx_2.7)
              version_id="2.7"
              title="2.7"
              ;;
            edgetx_2.8)
              version_id="2.8"
              title="2.8"
              ;;
            edgetx_2.9)
              version_id="2.9"
              title="2.9"
              ;;
            edgetx_2.10)
              version_id="2.10"
              title="2.10"
              ;;
            edgetx_2.11)
              version_id="2.11"
              title="2.11"
              ;;
            main)
              version_id="dev"
              title="Dev"
              ;;
            *)
              echo "Unsupported branch: ${branch}" >&2
              exit 1
              ;;
          esac

          if [[ "${branch}" == "${latest_branch}" ]]; then
            aliases="${version_id} latest"
          else
            aliases="${version_id}"
          fi

          {
            echo "version_id=${version_id}"
            echo "title=${title}"
            echo "aliases=${aliases}"
          } >> "${GITHUB_OUTPUT}"

      - name: Sync docs dependencies
        run: uv sync

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs with mike
        run: uv run mike deploy --push --update-aliases --title "${{ steps.version.outputs.title }}" ${{ steps.version.outputs.aliases }}

      - name: Set default docs version
        if: github.ref_name == 'edgetx_2.12'
        run: uv run mike set-default --push latest
