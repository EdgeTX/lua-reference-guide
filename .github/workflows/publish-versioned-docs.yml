# Publishes the maintained docs via `mike deploy` on every push:
#   main        -> "dev"
#   edgetx_2.12 -> "2.12" + "latest"
#   edgetx_2.11 -> "2.11" (LTS)
#
# main and edgetx_2.12 carry the MkDocs site and build from their own
# mkdocs.yml. GitBook-era branches (2.4-2.11) have no MkDocs config or
# tooling, so for those the job checks out the tooling from the latest
# release branch and converts the pushed branch's content with
# tools/import_legacy_gitbook.py before deploying. A push to edgetx_2.11
# can only run workflows committed on edgetx_2.11, so that branch carries
# a small caller workflow that invokes this one via workflow_call.
# 2.4-2.10 are frozen and were deployed by hand the same way (import, then
# `mike deploy --config-file <generated config> --push <version>`).
#
# mike keeps the accumulated versioned site on the gh-pages branch; after
# each deploy, the full gh-pages tree is published to Cloudflare Workers
# (static assets, see wrangler.jsonc). Requires the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID repository secrets.
name: Publish Versioned Docs

on:
  push:
    branches:
      - main
      - edgetx_2.12
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # Every run rewrites gh-pages and then uploads the whole tree, so run
    # them one at a time to avoid racing mike or publishing a stale
    # snapshot. This is job-level rather than workflow-level so it also
    # applies when called from another branch's workflow.
    concurrency:
      group: publish-versioned-docs
      cancel-in-progress: false

    steps:
      - name: Resolve version metadata
        id: version
        shell: bash
        run: |
          # In a workflow_call run, github.ref_name is the caller's branch.
          branch="${GITHUB_REF_NAME}"
          latest_branch="edgetx_2.12"

          case "${branch}" in
            main)
              version_id="dev"
              title="Dev"
              source="mkdocs"
              ;;
            edgetx_2.12)
              version_id="2.12"
              title="2.12"
              source="mkdocs"
              ;;
            edgetx_2.[4-9]|edgetx_2.1[01])
              version_id="${branch#edgetx_}"
              title="${version_id}"
              source="gitbook"
              ;;
            *)
              echo "Unsupported branch: ${branch}" >&2
              exit 1
              ;;
          esac

          if [[ "${branch}" == "${latest_branch}" ]]; then
            aliases="${version_id} latest"
          else
            aliases="${version_id}"
          fi

          if [[ "${source}" == "gitbook" ]]; then
            tools_ref="${latest_branch}"
            config_file=".site-legacy-generated/${version_id}/mkdocs.yml"
          else
            tools_ref="${GITHUB_SHA}"
            config_file="mkdocs.yml"
          fi

          {
            echo "branch=${branch}"
            echo "version_id=${version_id}"
            echo "title=${title}"
            echo "aliases=${aliases}"
            echo "source=${source}"
            echo "tools_ref=${tools_ref}"
            echo "config_file=${config_file}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tools_ref }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync docs dependencies
        run: uv sync

      - name: Import GitBook content
        if: steps.version.outputs.source == 'gitbook'
        run: uv run python tools/import_legacy_gitbook.py --ref "origin/${{ steps.version.outputs.branch }}"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish docs with mike
        env:
          # "Edit this page" should open the branch this version is built
          # from. Imported GitBook configs set their own empty edit_uri.
          DOCS_EDIT_URI: edit/${{ steps.version.outputs.branch }}/website/md-docs/
        run: uv run mike deploy --push --update-aliases --config-file "${{ steps.version.outputs.config_file }}" --title "${{ steps.version.outputs.title }}" ${{ steps.version.outputs.aliases }}

      - name: Set default docs version
        if: steps.version.outputs.branch == 'edgetx_2.12'
        run: uv run mike set-default --push latest

      - name: Export gh-pages tree for Cloudflare
        run: |
          rm -rf .site-publish
          mkdir .site-publish
          git archive gh-pages | tar -x -C .site-publish

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
